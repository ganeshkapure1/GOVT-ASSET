version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: govasset_postgres
    restart: always
    environment:
      POSTGRES_USER: govasset_user
      POSTGRES_PASSWORD: SecurePassword123
      POSTGRES_DB: govasset_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govasset_user -d govasset_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
